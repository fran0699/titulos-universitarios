<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- T-1.7.1 (HU-1.7): encabezado comun de las pantallas con sesion. -->
<header class="app-header" th:fragment="encabezado">
    <div class="app-header-inner">
        <a class="app-brand" th:href="@{/titulos}">
            <svg class="app-brand-icon" width="26" height="26" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
                <path d="M22 10 12 5 2 10l10 5 10-5Z"></path>
                <path d="M6 12v5c3 2 9 2 12 0v-5"></path>
            </svg>
            Títulos Universitarios
        </a>
        <nav class="app-nav" aria-label="Principal">
            <a class="app-nav-link" th:href="@{/titulos}">Títulos</a>
        </nav>
        <div class="app-user" th:if="${usuarioActual != null}">
            <span class="app-user-name" th:text="${usuarioActual.nombre}">usuario</span>
            <span class="app-user-role" th:text="${usuarioActual.rolTexto}">Rol</span>
        </div>
    </div>
</header>
</body>
</html>
