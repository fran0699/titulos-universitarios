    <!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Títulos</title>
    <link rel="stylesheet" th:href="@{/css/titulos.css}">
</head>
<body>
<header th:replace="~{fragments/encabezado :: encabezado}"></header>
<main class="page-shell">
    <section class="card">
        <header class="page-header">
            <p class="eyebrow">Gestión académica</p>
            <h1>Títulos registrados</h1>
            <p class="subtitle">Consulta todos los títulos registrados.</p>
            <p th:if="${usuarioActual != null and usuarioActual.registrador}">
                <a class="button button-primary" th:href="@{/titulos/nuevo}">Registrar título</a>
            </p>
        </header>

        <p class="notice notice-success" th:if="${mensaje}" th:text="${mensaje}" role="status"></p>
        <p class="notice notice-error" th:if="${error}" th:text="${error}" role="alert"></p>

        <p class="empty-state" th:if="${#lists.isEmpty(titulos)}">Aún no hay títulos registrados.</p>
        <div class="table-scroll" th:unless="${#lists.isEmpty(titulos)}">
            <table>
                <thead>
                <tr>
                    <th scope="col">Graduado</th>
                    <th scope="col">Tipo</th>
                    <th scope="col">N.º de documento</th>
                    <th scope="col">Título</th>
                    <th scope="col">Fecha de registro</th>
                    <th scope="col">Estado</th>
                    <th scope="col">Credencial</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="titulo : ${titulos}">
                    <td th:text="${titulo.nombreGraduado}"></td>
                    <td th:text="${titulo.graduado != null ? titulo.graduado.tipoDocumento.etiqueta : '—'}"></td>
                    <td th:text="${titulo.graduado != null ? titulo.graduado.numeroDocumento : '—'}"></td>
                    <td th:text="${titulo.nombreTitulo}"></td>
                    <td th:text="${titulo.fechaRegistro}"></td>
                    <td th:text="${titulo.estado}"></td>
                    <td>
                        <a class="button button-primary"
                           th:if="${titulo.estado != null and titulo.estado.name() == 'APROBADO'}"
                           th:href="@{/titulos/{id}/credencial(id=${titulo.id})}"
                           th:aria-label="|Descargar credencial PDF de ${titulo.nombreGraduado}|">
                            Descargar PDF
                        </a>
                        <span th:unless="${titulo.estado != null and titulo.estado.name() == 'APROBADO'}">No disponible</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
