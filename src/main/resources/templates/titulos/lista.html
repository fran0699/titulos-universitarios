<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de títulos</title>
    <link rel="stylesheet" th:href="@{/css/titulos.css}">
</head>
<body>
<main class="page-shell">
    <section class="card">
        <header class="page-header">
            <p class="eyebrow">Gestión académica</p>
            <h1>Registro de títulos universitarios</h1>
            <p class="subtitle">Registra y consulta los títulos de los graduados.</p>
            <p class="subtitle"><a th:href="@{/titulos/pendientes}">Ver títulos pendientes de revisión &rarr;</a></p>
        </header>

        <p class="notice notice-success" th:if="${mensaje}" th:text="${mensaje}" role="status"></p>
        <p class="notice notice-error" th:if="${error}" th:text="${error}" role="alert"></p>

        <form class="form-grid" th:action="@{/titulos}" th:object="${titulo}" method="post">
            <div class="form-field">
                <label for="nombreGraduado">Nombre del graduado</label>
                <input id="nombreGraduado" type="text" th:field="*{nombreGraduado}" autocomplete="name" required>
            </div>
            <div class="form-field">
                <label for="nombreTitulo">Nombre del título</label>
                <input id="nombreTitulo" type="text" th:field="*{nombreTitulo}" required>
            </div>
            <button class="button button-primary" type="submit">Registrar título</button>
        </form>
    </section>

    <section class="card">
        <header class="section-header">
            <h2>Títulos registrados</h2>
        </header>
        <p class="empty-state" th:if="${#lists.isEmpty(titulos)}">Aún no hay títulos registrados.</p>
        <div class="table-scroll" th:unless="${#lists.isEmpty(titulos)}">
            <table>
                <thead>
                <tr>
                    <th scope="col">Graduado</th>
                    <th scope="col">Título</th>
                    <th scope="col">Fecha de registro</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="titulo : ${titulos}">
                    <td th:text="${titulo.nombreGraduado}"></td>
                    <td th:text="${titulo.nombreTitulo}"></td>
                    <td th:text="${titulo.fechaRegistro}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
