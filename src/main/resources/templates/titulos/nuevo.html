<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar título</title>
    <link rel="stylesheet" th:href="@{/css/titulos.css}">
</head>
<body>
<header th:replace="~{fragments/encabezado :: encabezado}"></header>

<main class="page-shell">
    <section class="card">
        <header class="page-header">
            <p class="eyebrow"><a th:href="@{/titulos}">Títulos</a> › Registrar</p>
            <h1>Registrar título</h1>
            <p class="subtitle">Los campos marcados con * son obligatorios.</p>
            <p class="subtitle">El título quedará PENDIENTE hasta que un aprobador lo revise.</p>
        </header>

        <p class="notice notice-error"
           th:if="${error}"
           th:text="${error}"
           role="alert"></p>

        <form class="form-grid"
              th:action="@{/titulos/nuevo}"
              th:object="${titulo}"
              method="post">

            <div class="form-field">
                <label for="tipoDocumento">Tipo de documento *</label>
                <select id="tipoDocumento"
                        th:field="*{graduado.tipoDocumento}"
                        required>
                    <option value="">Seleccione...</option>
                    <option th:each="tipo : ${tiposDocumento}"
                            th:value="${tipo}"
                            th:text="${tipo}">
                    </option>
                </select>
                <small class="field-error"
                       th:if="${errores != null and errores['graduado.tipoDocumento'] != null}"
                       th:text="${errores['graduado.tipoDocumento']}"></small>
            </div>

            <div class="form-field">
                <label for="numeroDocumento">Número de documento *</label>
                <input id="numeroDocumento"
                       type="text"
                       th:field="*{graduado.numeroDocumento}"
                       minlength="5"
                       maxlength="20"
                       autocomplete="off"
                       aria-describedby="ayudaDocumento"
                       required>
                <small id="ayudaDocumento" class="field-help">
                    Cédula: con guiones, provincia-tomo-asiento (por ejemplo, 8-123-456).
                    Pasaporte: ingrese el número del documento.
                </small>
                <small class="field-error"
                       th:if="${errores != null and errores['graduado.numeroDocumento'] != null}"
                       th:text="${errores['graduado.numeroDocumento']}"></small>
            </div>

            <div class="form-field">
                <label for="nombreGraduado">Nombre del graduado *</label>
                <input id="nombreGraduado"
                       type="text"
                       th:field="*{nombreGraduado}"
                       minlength="3"
                       maxlength="120"
                       autocomplete="name"
                       required>
                <small class="field-error"
                       th:if="${errores != null and errores['nombreGraduado'] != null}"
                       th:text="${errores['nombreGraduado']}"></small>
            </div>

            <div class="form-field">
                <label for="nombreTitulo">Nombre del título *</label>
                <input id="nombreTitulo"
                       type="text"
                       th:field="*{nombreTitulo}"
                       required>
                <small class="field-error"
                       th:if="${errores != null and errores['nombreTitulo'] != null}"
                       th:text="${errores['nombreTitulo']}"></small>
            </div>

            <div class="form-actions">
                <a class="button button-secondary" th:href="@{/titulos}">Cancelar</a>
                <button class="button button-primary" type="submit">Registrar título</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
