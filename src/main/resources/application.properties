spring.application.name=titulos-universitarios
management.endpoints.web.exposure.include=health,metrics,info,prometheus

spring.datasource.url=jdbc:postgresql://localhost:5432/titulos_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# T-4.10.1 (HU-4.10): usuario técnico de solo lectura para Prometheus.
# La contraseña viene de la variable de entorno PROMETHEUS_PASSWORD
# (mínimo 12 caracteres) y no se guarda en el repositorio.
titulos.monitoreo.usuario=prometheus
titulos.monitoreo.password=${PROMETHEUS_PASSWORD:}

# HU-2.5: URL base impresa en la credencial y codificada en su QR.
titulos.verificacion.url=${TITULOS_VERIFICACION_URL:http://localhost:8080/verificar}
# HU-3.1: nombre de la institucion que muestra la verificacion publica (P7 y P8).
# Los acentos van escapados en Unicode porque Spring Boot lee este archivo como
# ISO-8859-1 y escritos directamente salian rotos en pantalla.
titulos.institucion.nombre=Universidad Tecnol\u00f3gica de Panam\u00e1
