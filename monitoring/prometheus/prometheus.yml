global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: titulos-universitarios
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets:
          - host.docker.internal:8080
    basic_auth:
      # T-4.10.3 (HU-4.10): usuario técnico de solo lectura (rol MONITOREO).
      username: prometheus
      password_file: /etc/prometheus/secrets/monitoreo.password